name: Release

# Tag a version to publish: `npm version 0.1.0` (bumps manifest.json and versions.json via
# version-bump.mjs), `git push --follow-tags`. The tag must equal manifest.json's version;
# Obsidian's community plugin directory downloads main.js, manifest.json and styles.css
# from the release with that tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Build provenance attestations for the release assets (actions/attest-build-provenance).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node esbuild.config.mjs production
      - name: Verify tag matches manifest
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          test "$tag" = "$version" || { echo "tag $tag != manifest version $version"; exit 1; }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Release notes from CHANGELOG.md
        # The tag's own section, without its heading, is the release body.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v v="$tag" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG.md section for $tag"; exit 1; }
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
          draft: true
          generate_release_notes: false
